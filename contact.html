<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact iLoveWord</title><link rel="stylesheet" href="style.css">
<style>label{display:block;margin:14px 0 4px;font-weight:600}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #c8c8cc;border-radius:12px;font:inherit;background:var(--bg);color:var(--fg)}textarea{min-height:120px}button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:999px;background:var(--acc);color:#fff;font:600 17px/1 inherit;font-family:inherit}.hp{display:none}</style></head><body><main>
<nav><a href="index.html">Support</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy Policy</a></nav>
<h1>Contact us</h1><p class="mut">Questions, problems or ideas about iLoveWord? Send us a message.</p>
<form action="https://formsubmit.co/irsyad.mukhtar@yahoo.com" method="POST">
<input type="hidden" name="_subject" value="[Website] iLoveWord contact">
<input type="hidden" name="_template" value="box">
<input type="hidden" name="_next" value="https://irsyad-git.github.io/iloveword-site/thanks.html">
<input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">
<label for="n">Name</label><input id="n" name="name" required autocomplete="name">
<label for="e">Email</label><input id="e" type="email" name="email" required autocomplete="email">
<label for="s">Subject</label><select id="s" name="subject"><option>General information / Contact</option><option>I have a problem</option><option>I have a question</option><option>Feature request</option><option>Other</option></select>
<label for="m">Message</label><textarea id="m" name="message" required></textarea>
<button type="submit">Send message</button></form>
</main></body></html>
